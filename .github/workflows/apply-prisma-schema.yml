name: Apply Prisma schema

on:
  # Run automatically when this workflow changes; later runs can be started manually.
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-prisma-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-schema:
    name: Sync Prisma schema to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check required database secrets
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Configure the DATABASE_URL repository secret to point to the intended Supabase database."
            exit 1
          fi
          if [[ -z "$DIRECT_URL" ]]; then
            echo "::error::Configure the DIRECT_URL repository secret to point to the same Supabase database, using a direct or session-pooler connection suitable for schema changes."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and repair package lock
        run: npm install --no-audit --no-fund

      - name: Commit repaired package lock, if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm package lock"
          git push origin HEAD:main

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply schema without forcing data loss
        run: npx prisma db push --skip-generate
